server.port=8080
server.address=0.0.0.0

spring.application.name=Induztek

spring.datasource.url=jdbc:postgresql://localhost:5432/induztek_db
spring.datasource.username=miloronu
spring.datasource.password=postgress

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Límite de tamaño para carga de fotos o payloads JSON
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.root=INFO
# Cambia "com.tu_paquete" por el paquete base de tu proyecto Spring Boot (ej. cl.induztek o com.example)
logging.level.com.example.Induztek=DEBUG
logging.level.org.springframework.web=INFO
